name: Release

# Publish a GitHub release only when VERSION.md is a semver strictly greater
# than the newest existing release tag. Equal or lower versions succeed and
# publish nothing. A repository with no semver release yet publishes VERSION.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.x'

jobs:
  version:
    name: Compare VERSION.md
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compare with existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(-version-file VERSION.md)
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              args+=(-known "$name")
            fi
          done < <(git tag -l 'v*')
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              args+=(-known "$name")
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')
          go run ./scripts/planrelease "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset: linboard-linux-amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset: linboard-linux-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev libxxf86vm-dev libayatana-appindicator3-dev \
            libdbus-1-dev

      - name: Build binary
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Building version $VERSION for ${{ matrix.name }}"
          go mod tidy
          git diff --exit-code go.mod go.sum
          go vet ./...
          go test ./...
          LDFLAGS="-s -w -X github.com/foisal/linboard/internal/config.AppVersion=${VERSION}"
          go build -ldflags "$LDFLAGS" -o linboard ./cmd/linboard
          test "$(./linboard version)" = "LinBoard ${VERSION}"
          file linboard
          ls -lh linboard

      - name: Package release archive
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ASSET="${{ matrix.asset }}"
          PKG="dist/${ASSET}"
          mkdir -p "$PKG"
          cp linboard "$PKG/"
          cp scripts/package/install.sh "$PKG/install.sh"
          mkdir -p "$PKG/lib"
          cp scripts/lib/system-setup.sh "$PKG/lib/system-setup.sh"
          cp install/linboard.desktop "$PKG/linboard.desktop"
          mkdir -p "$PKG/icons"
          cp -r internal/assets/icons/hicolor "$PKG/icons/"
          cp scripts/package/QUICKSTART.txt "$PKG/QUICKSTART.txt"
          chmod +x "$PKG/install.sh" "$PKG/linboard"
          tar -czf "dist/${ASSET}-v${VERSION}.tar.gz" -C "$PKG" .
          (cd dist && sha256sum "${ASSET}-v${VERSION}.tar.gz" > "${ASSET}-v${VERSION}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}-v${{ needs.version.outputs.version }}.tar.gz*

  release:
    name: Tag & publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: find dist -type f | sort

      - name: Generate release description
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@TAG@/${TAG}/g" \
            .github/release-notes.md > /tmp/release-body.md
          echo "" >> /tmp/release-body.md
          echo "---" >> /tmp/release-body.md
          echo "" >> /tmp/release-body.md
          echo "## What's changed" >> /tmp/release-body.md
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            echo "Compare: [\`${PREV}...${TAG}\`](https://github.com/${{ github.repository }}/compare/${PREV}...${TAG})" >> /tmp/release-body.md
          fi
          git log --oneline --pretty=format:'- %s (%h)' -20 >> /tmp/release-body.md

      - name: Create and push tag
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — reusing for release upload"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LinBoard ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/release-body.md
          files: |
            dist/**/*.tar.gz
            dist/**/*.sha256
